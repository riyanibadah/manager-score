<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Top manager complaints ranked by share of reviews">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b2df5"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" rx="18" fill="#ffffff"/>
  <text x="40" y="52" fill="#0b1020" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="800">What employees complain about most</text>
  <text x="40" y="82" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Share of manager reviews mentioning each · ManagerScore</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- 1 -->
    <text x="300" y="136" text-anchor="end" font-size="18" font-weight="600" fill="#334155">Unclear priorities</text>
    <rect x="316" y="115" width="600" height="30" rx="7" fill="url(#bar)"/>
    <text x="928" y="136" font-size="18" font-weight="800" fill="#0b1020">30%</text>
    <!-- 2 -->
    <text x="300" y="192" text-anchor="end" font-size="18" font-weight="600" fill="#334155">Plays favorites</text>
    <rect x="316" y="171" width="560" height="30" rx="7" fill="url(#bar)"/>
    <text x="888" y="192" font-size="18" font-weight="800" fill="#0b1020">28%</text>
    <!-- 3 -->
    <text x="300" y="248" text-anchor="end" font-size="18" font-weight="600" fill="#334155">High pressure</text>
    <rect x="316" y="227" width="520" height="30" rx="7" fill="url(#bar)"/>
    <text x="848" y="248" font-size="18" font-weight="800" fill="#0b1020">26%</text>
    <!-- 4 -->
    <text x="300" y="304" text-anchor="end" font-size="18" font-weight="600" fill="#334155">Poor communication</text>
    <rect x="316" y="283" width="520" height="30" rx="7" fill="url(#bar)"/>
    <text x="848" y="304" font-size="18" font-weight="800" fill="#0b1020">26%</text>
    <!-- 5 -->
    <text x="300" y="360" text-anchor="end" font-size="18" font-weight="600" fill="#334155">Micromanages</text>
    <rect x="316" y="339" width="480" height="30" rx="7" fill="url(#bar)"/>
    <text x="808" y="360" font-size="18" font-weight="800" fill="#0b1020">24%</text>
    <!-- 6 -->
    <text x="300" y="416" text-anchor="end" font-size="18" font-weight="600" fill="#334155">Blames the team</text>
    <rect x="316" y="395" width="420" height="30" rx="7" fill="url(#bar)"/>
    <text x="748" y="416" font-size="18" font-weight="800" fill="#0b1020">21%</text>
    <!-- 7 -->
    <text x="300" y="472" text-anchor="end" font-size="18" font-weight="600" fill="#334155">Takes credit</text>
    <rect x="316" y="451" width="280" height="30" rx="7" fill="url(#bar)"/>
    <text x="608" y="472" font-size="18" font-weight="800" fill="#0b1020">14%</text>
    <!-- 8 -->
    <text x="300" y="528" text-anchor="end" font-size="18" font-weight="600" fill="#334155">Too many meetings</text>
    <rect x="316" y="507" width="220" height="30" rx="7" fill="url(#bar)"/>
    <text x="548" y="528" font-size="18" font-weight="800" fill="#0b1020">11%</text>
  </g>
</svg>
